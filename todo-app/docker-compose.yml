# Distinct project name so prod does not share containers or the mongo_data
# volume with docker-compose.dev.yml, which lives in this same directory
name: todo-app-prod

services:
  mongo:
    build:
      context: ./todo-backend/mongo
    image: initialized_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    restart: unless-stopped

  app:
    image: todo-front
    build:
      context: ./todo-frontend/
      args:
        # Baked into the bundle at build time, not read at runtime
        VITE_BACKEND_URL: /api
    restart: unless-stopped

  server:
    depends_on:
      [mongo, redis]
    image: todo-backend
    build:
      context: ./todo-backend/
    environment:
      MONGO_URL: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongo:27017/${MONGO_DATABASE}
      REDIS_URL: redis://redis:6379
    restart: unless-stopped

  nginx:
    image: nginx:1.29
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - 8080:80
    depends_on:
      [app, server]
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
