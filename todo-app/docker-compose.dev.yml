services:
  app:
    image: todo-front-dev
    build:
      context: ./todo-frontend/ # The context will pick this directory as the "build context"
      dockerfile: ./dev.Dockerfile # This will simply tell which dockerfile to read
    volumes:
      - ./todo-frontend/:/usr/src/app # Must match the build context, not the compose file's directory
      - /usr/src/app/node_modules # Keep the image's node_modules from being shadowed by the mount
    environment:
      - VITE_BACKEND_URL=/api/
    container_name: todo-front-dev # This will name the container hello-front-dev
  
  mongo:
    build:
      context: ./todo-backend/mongo
    image: initialized_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: the_database
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data

  server:
    depends_on:
      [mongo, redis]
    image: todo-backend-dev
    build:
      context: ./todo-backend/
      dockerfile: dev.Dockerfile
    volumes:
      - ./todo-backend/:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      MONGO_URL: mongodb://the_username:the_password@mongo:27017/the_database
      REDIS_URL: redis://redis:6379


  nginx:
    image: nginx:1.29
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 8080:80
    container_name: reverse-proxy
    depends_on:
      [app, server]
  
volumes:
  mongo_data:
  redis_data: